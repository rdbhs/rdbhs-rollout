[project]
name = "rdbhs-rollout"
version = "0.1.0"
description = "RDBHS warehouse builder"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4,<2",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "google-auth-oauthlib>=1.5.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "reportlab>=4.4,<5",
    "rollout",
]

[tool.uv.sources]
rollout = { path = "../rollout", editable = true }
